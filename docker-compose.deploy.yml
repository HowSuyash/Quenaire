# The stack that actually gets deployed.
#
# docker-compose.prod.yml asks for Keycloak, Kafka, Redis, S3 and SMTP. Nothing
# in the codebase reads from Redis or Kafka -- there is no RedisTemplate, no
# @Cacheable and no @KafkaListener anywhere -- so carrying them costs money and
# failure modes for no work done. This file runs what the product needs:
# Postgres for everything, Ollama for embeddings, and Caddy for TLS.
#
# Generation is hosted (see application-prod.yml). Embeddings stay local because
# nomic-embed-text is small and embedding is the cheap half of the pipeline.
#
#   cp .env.deploy.example .env && edit it
#   docker compose -f docker-compose.deploy.yml up -d
#
# Requires ~4GB RAM; 8GB is comfortable.

# Named explicitly rather than derived from the directory, which changes with
# the checkout path.
name: quenaire

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quenaire
      POSTGRES_USER: quenaire
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Off by default in the image; the schema declares vector columns.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the database Keycloak keeps accounts in. Runs once, on an empty
      # data directory, so adding it to a server that is already running does
      # nothing -- create the database by hand there.
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quenaire -d quenaire"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published to the host: only the app needs it, and an open 5432 is the
    # single most scanned port on a public IP.
    expose:
      - "5432"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Pulls the embedding model once, then exits. Without this the first upload
  # fails while Ollama downloads 275MB, and the document is marked FAILED.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull nomic-embed-text"]
    restart: "no"

  # Sign-in. Accounts live in Postgres, not in the container: `start-dev` keeps
  # them in an in-memory H2 database, so every restart would lose every user.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # Not --optimized: that flag expects an image already augmented by `kc.sh
    # build`, and this is the stock one, so it would refuse to start. The cost is
    # a slower first boot while Keycloak builds its configuration.
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Caddy terminates TLS and the frontend proxies /auth, so Keycloak sees
      # plain HTTP and must take the public origin from the forwarded headers.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      COMPLYAI_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:?set KEYCLOAK_BACKEND_SECRET in .env}
      # This domain and nothing else. A wildcard here is how an authorization
      # code is delivered somewhere it should not be.
      COMPLYAI_REDIRECT_URIS: ${PUBLIC_URL}/*
      COMPLYAI_WEB_ORIGINS: ${PUBLIC_URL}
    volumes:
      - ./deploy/keycloak/quenaire-realm.json:/opt/keycloak/data/import/quenaire-realm.json:ro
      - ./deploy/keycloak/health.sh:/health.sh:ro
    healthcheck:
      test: ["CMD", "/health.sh"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quenaire-app:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # stringtype=unspecified is required: the schema uses native Postgres enum
      # columns, and the driver binds enums as varchar without it.
      DATABASE_URL: jdbc:postgresql://postgres:5432/quenaire?stringtype=unspecified
      DATABASE_USER: quenaire
      DATABASE_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OLLAMA_BASE_URL: http://ollama:11434
      STORAGE_LOCAL_PATH: /var/quenaire/storage
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/quenaire/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/auth/realms/quenaire
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_REALM: quenaire
      KEYCLOAK_ADMIN_CLIENT_ID: quenaire-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET}
      KEYCLOAK_REALM: quenaire
      # The API is not reachable from a browser -- the frontend proxies it --
      # so no cross-origin request should be permitted. The code default is
      # "*" with credentials allowed, which would let any site call the API
      # with the user's session.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
    volumes:
      - app-storage:/var/quenaire/storage
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Internal address, the same in every deployment. Next bakes rewrite
        # destinations at build time; the public hostname is not among them.
        BACKEND_URL: http://app:8080
        KEYCLOAK_URL: http://keycloak:8080
    image: quenaire-frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Read on the server at request time, so this image runs behind any
      # hostname without being rebuilt.
      BACKEND_URL: http://app:8080
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Terminates TLS and issues its own certificate from Let's Encrypt. The only
  # container with published ports.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  ollama-models:
  app-storage:
  caddy-data:
  caddy-config:
