<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComplyAI Auto-Filler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a202c;
      background: white;
      width: 320px;
      min-height: 400px;
    }
    .header {
      padding: 16px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 28px; height: 28px; }
    .logo-text { font-weight: 700; font-size: 16px; }
    .status { font-size: 11px; padding: 2px 8px; background: rgba(255,255,255,0.2); border-radius: 9999px; }
    .content { padding: 16px; }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: #718096; margin-bottom: 12px;
    }
    .stat-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #edf2f7;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 12px; color: #4a5568; }
    .stat-value { font-weight: 700; font-size: 18px; color: #1a202c; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-radius: 6px; font-size: 13px;
      font-weight: 600; border: none; cursor: pointer; width: 100%;
      transition: all 0.2s;
    }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-secondary { background: #edf2f7; color: #4a5568; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-link {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 12px; color: #4a5568; text-decoration: none;
      transition: all 0.2s;
    }
    .quick-link:hover { background: #f7fafc; border-color: #4f46e5; color: #4f46e5; }
    .status-indicator {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
    }
    .status-indicator.connected { background: #dcfce7; color: #166534; }
    .status-indicator.disconnected { background: #fee2e2; color: #991b1b; }
    .footer { padding: 12px 16px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #a0aec0; text-align: center; }
    .footer a { color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
      <span class="logo-text">ComplyAI</span>
    </div>
    <span class="status" id="connectionStatus">Checking...</span>
  </div>

  <div class="content">
    <section class="section">
      <div class="section-title">Status</div>
      <div class="status-indicator disconnected" id="statusIndicator">
        <span class="dot"></span>
        <span>Disconnected</span>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Quick Stats</div>
      <div class="stat-row">
        <span class="stat-label">Questions Detected</span>
        <span class="stat-value" id="statDetected">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Auto-Filled</span>
        <span class="stat-value" id="statFilled">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">High Confidence</span>
        <span class="stat-value" id="statHighConf">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Needs Review</span>
        <span class="stat-value" id="statNeedsReview">0</span>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Quick Actions</div>
      <button class="btn btn-primary" id="btnFillAll">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
        </svg>
        Auto-Fill All
      </button>
      <button class="btn btn-primary" id="btnSubmit" style="margin-top: 8px; background: #059669;" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13"></path>
          <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
        Submit to ComplyAI
      </button>
      <button class="btn btn-secondary" id="btnRefresh" style="margin-top: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
        </svg>
        Refresh Detection
      </button>
    </section>

    <section class="section">
      <div class="section-title">Open In</div>
      <div class="quick-links">
        <a href="#" class="quick-link" id="linkSidePanel">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          Side Panel
        </a>
        <a href="#" class="quick-link" id="linkOptions">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 21.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00-.33-1.82 1.65 1.65 0 00-1-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00-.33-1.82 1.65 1.65 0 00-1-1.51V3a2 2 0 012-2 2 2 0 012 2v.09z"></path>
          </svg>
          Settings
        </a>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Platform Support</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px;">
        <span style="background:#e0e7ff;color:#3730a3;padding:2px 8px;border-radius:4px;">OneTrust</span>
        <span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;">Whistic</span>
        <span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;">Loopio</span>
        <span style="background:#fce7f3;color:#9d174d;padding:2px 8px;border-radius:4px;">CyberGRX</span>
        <span style="background:#f3f4f6;color:#374151;padding:2px 8px;border-radius:4px;">Google Forms</span>
        <span style="background:#ede9fe;color:#5b21b6;padding:2px 8px;border-radius:4px;">Typeform</span>
      </div>
    </section>

    <div class="footer">
      ComplyAI v1.0 | <a href="https://complyai.io" target="_blank">Documentation</a> • <a href="https://complyai.io/privacy" target="_blank">Privacy</a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
