# The JVM the Gradle daemon itself runs on -- not the same thing as the
# toolchain in build.gradle.kts, which is the JVM that compiles the code.
#
# Gradle 8.14 (required by the Spring Boot 3.2.5 plugin, which cannot run on
# Gradle 9) does not understand JDK 26 and fails to start on it with a bare
# version number as the error. This pins the daemon to 21, which the foojay
# resolver in settings.gradle.kts provisions when it is missing.
toolchainVersion=21
