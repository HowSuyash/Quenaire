spring:
  datasource:
    url: jdbc:h2:mem:quenaire;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    # H2 cannot express pgvector's vector(1536); this file rewrites just those two
    # column definitions so local dev boots without Postgres. See orm-local-h2.xml.
    mapping-resources:
      - orm-local-h2.xml
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: false
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

server:
  port: 8080
  # Controllers already declare /api; a context-path here would double it.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.quenaire: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    jwk-set-uri: http://localhost:8081/realms/quenaire/protocol/openid-connect/certs
