# A public HTTPS demo, running on your own machine, costing nothing.
#
# For showing the product to a prospective design partner on a call. Cloudflare
# issues a temporary https://<random>.trycloudflare.com address that forwards to
# the frontend here -- no account, no card, no domain, no ports opened on your
# router. The address changes every run and disappears when you stop it, which
# is why this is for demos and docker-compose.deploy.yml is for a real server.
#
# Generation runs on your local Ollama, so it costs nothing and takes about
# twenty seconds a question. Pick five or six questions for a demo rather than
# loading a ninety-question questionnaire.
#
#   docker compose -f docker-compose.demo.yml up -d --build
#   docker compose -f docker-compose.demo.yml logs cloudflared | grep trycloudflare
#
# Requires Ollama running on the host with nomic-embed-text and a chat model.

# Its own project, so `down` here cannot take the development stack with it:
# Compose derives the project name from the directory otherwise, and every
# compose file in this repo would share one.
name: complyai-demo

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: complyai
      POSTGRES_USER: complyai
      POSTGRES_PASSWORD: complyai
    volumes:
      - demo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complyai -d complyai"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Sign-in. Served under /auth on the frontend's own origin (see the rewrite in
  # next.config.js) because the demo tunnel exposes one address, and the browser
  # has to reach the login page. Production does the same through Caddy, so the
  # shape is the same in both.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_RELATIVE_PATH: /auth
      # Behind a proxy that terminates TLS; without this Keycloak builds its
      # redirect and issuer URLs from the internal http://keycloak:8080.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      # Health lives on the management port (9000) from Keycloak 25 and is off
      # until asked for. Without it the readiness probe below has nothing to hit.
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      COMPLYAI_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:-demo-backend-secret}
      # A demo tunnel gets a new hostname every run, so the redirect cannot be
      # pinned here. Deployments name their own domain and nothing else --
      # a wildcard is how an authorization code ends up somewhere else.
      COMPLYAI_REDIRECT_URIS: "https://*.trycloudflare.com/*"
      COMPLYAI_WEB_ORIGINS: "+"
    volumes:
      - ./deploy/keycloak/complyai-realm.json:/opt/keycloak/data/import/complyai-realm.json:ro
      - ./deploy/keycloak/health.sh:/health.sh:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "/health.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/complyai?stringtype=unspecified
      DATABASE_USER: complyai
      DATABASE_PASSWORD: complyai
      # Local generation: free, and slow. The demo is short enough for it.
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      # The tunnel address is not known until Cloudflare assigns one, and
      # nothing in a demo depends on it: the browser stays on one origin.
      FRONTEND_URL: http://localhost:3000
      STORAGE_LOCAL_PATH: /var/complyai/storage
      # Validation uses the internal address: the token's issuer is the public
      # one, but the signing keys are fetched server to server.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/complyai/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/auth/realms/complyai
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_REALM: complyai
      KEYCLOAK_ADMIN_CLIENT_ID: complyai-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_BACKEND_SECRET:-demo-backend-secret}
      KEYCLOAK_REALM: complyai
    volumes:
      - demo-storage:/var/complyai/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://app:8080
        KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - app
      - keycloak
    environment:
      BACKEND_URL: http://app:8080

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - frontend
    command: tunnel --no-autoupdate --url http://frontend:3000
    restart: unless-stopped

volumes:
  keycloak-data:
  demo-postgres:
  demo-storage:
