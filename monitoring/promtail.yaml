server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    static_labels:
      cluster: quenaire-prod
      environment: production
    pipeline_stages:
      - json:
          expressions:
            container: container
            container_id: container_id
            image: image
            level: level
            logger: logger
            message: message
            thread: thread
            timestamp: timestamp
      - labels:
          container:
          container_id:
          image:
          level:
          logger:
          thread:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=quenaire"]

  - job_name: system-logs
    static_labels:
      cluster: quenaire-prod
      environment: production
    static_configs:
      - targets:
          - localhost
        labels:
          job: system-logs
          __path__: /var/log/*log

  - job_name: application-logs
    static_labels:
      cluster: quenaire-prod
      environment: production
      component: application
    static_configs:
      - targets:
          - localhost
        labels:
          job: application-logs
          __path__: /var/log/application/*log