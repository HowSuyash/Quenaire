global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'quenaire-prod'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/api/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quenaire-app'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quenaire-postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quenaire-redis'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quenaire-kafka'

  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'quenaire-ollama'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['host.docker.internal:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'